name: mediq

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mediq-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter @mediq/backend test

      - name: Install Playwright Chromium
        run: pnpm --filter @mediq/web exec playwright install --with-deps chromium

      - name: Run web E2E and capture evidence
        run: pnpm evidence:web ci-${{ github.run_id }}

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            evidence/ci-${{ github.run_id }}/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 14
